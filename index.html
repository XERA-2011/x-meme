<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "template", "type": "string", "label": "当前激活模板", "default": "lyric_mv"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <!-- Root Container -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="150"
      data-width="1080"
      data-height="1920"
    >
      <!-- Template Mount 1: Lyric MV -->
      <div 
        id="mount-lyric" 
        data-composition-id="mount-lyric"
        class="clip" 
        data-composition-src="compositions/lyric_mv/index.html" 
        data-start="0" 
        data-duration="150" 
        data-track-index="0"
      ></div>
      
      <!-- Template Mount 2: News Intro -->
      <div 
        id="mount-news" 
        data-composition-id="mount-news"
        class="clip" 
        data-composition-src="compositions/news_intro/index.html" 
        data-start="0" 
        data-duration="150" 
        data-track-index="1"
      ></div>
      
      <!-- Template Mount 3: Science Popularization -->
      <div 
        id="mount-science" 
        data-composition-id="mount-science"
        class="clip" 
        data-composition-src="compositions/science_pop/index.html" 
        data-start="0" 
        data-duration="150" 
        data-track-index="2"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // Dynamically resolve template router variable
      const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
      const activeTemplate = vars.template || "lyric_mv";

      // Map template IDs to mount elements
      const mounts = {
        "lyric_mv": document.getElementById("mount-lyric"),
        "news_intro": document.getElementById("mount-news"),
        "science_pop": document.getElementById("mount-science")
      };

      // Perform clean routing: preserve only the target mount to ensure absolute audio/visual isolation
      Object.keys(mounts).forEach(key => {
        const el = mounts[key];
        if (el) {
          if (key === activeTemplate) {
            tl.set(el, { visibility: "visible" }, 0);
          } else {
            // Remove completely from the tree to avoid phantom track embedding or pre-rendering overhead
            el.remove();
          }
        }
      });
    </script>
  </body>
</html>
